name: CI Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: "Validate Survey"
        run: pnpm run validate-survey

      # Exhaustive model check of the branching (spec invariants, golden statistics, id lock)
      - name: "Verify Survey"
        run: pnpm run verify-survey

      # Independent cross-check with the z3 solver; the pip wheel ships the z3 CLI. Installed
      # before the tests so the solver tests run instead of skipping
      - name: "Install z3"
        run: |
          python3 -m venv "$RUNNER_TEMP/z3"
          "$RUNNER_TEMP/z3/bin/pip" install --quiet z3-solver==4.15.4.0
          echo "$RUNNER_TEMP/z3/bin" >> "$GITHUB_PATH"

      - name: "SMT cross-check of the survey logic"
        run: pnpm run verify-smt

      - name: "Astro Check"
        run: pnpm run astro check

      - name: "Run ESLint"
        run: pnpm run lint:ci

      - name: "Run Tests"
        run: pnpm run test:ci

      - name: "Build"
        run: pnpm run astro build

      - name: "Generate Coverage Report"
        # Set if: always() to also generate the report if tests are failing
        # Only works if you set `reportOnFailure: true` in your vite config as specified above
        if: always()
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2
