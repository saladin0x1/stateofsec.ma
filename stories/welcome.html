<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome Story</title>
<link rel="stylesheet" href="fun.css">
<style>
  .hero { position: relative; width: 900px; height: 330px; }
  .hero svg.bot { position: absolute; left: 290px; top: 0; }
  .bubble {
    position: absolute; left: 620px; top: 20px; padding: 16px 28px; background: var(--paper);
    border: 5px solid var(--ink); border-radius: 26px; box-shadow: 7px 7px 0 var(--ink);
    font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 42px; line-height: 1.12; transform: rotate(4deg); white-space: nowrap;
  }
  .bubble::after {
    content: ""; position: absolute; left: -26px; bottom: 18px; width: 30px; height: 30px; background: var(--paper);
    border-left: 5px solid var(--ink); border-bottom: 5px solid var(--ink); transform: rotate(45deg) skew(10deg, 10deg);
  }
  .card { position: relative; }
  .card .sticker { position: absolute; right: -30px; top: -34px; background: var(--green); transform: rotate(6deg); }
  .doodle { position: absolute; }
</style>
</head>

    <div class="h1" style="font-size: 116px; margin-top: 30px;"><span class="mark">25 legends</span><br>followed us.</div>

    <div class="sub" style="margin-top: 40px;">and shared us on their stories. our threat model did not account for this much love.</div>

    <div class="card" style="margin-top: 70px;">
      <div class="win">
        <div class="tb"><i></i><i></i><i></i><span>~/stateofsec</span></div>
        <div class="bd">
          <div><span class="prompt">$</span> whoami</div>
          <div>one of the first 25. respect.</div>
          <div><span class="prompt">$</span> sudo thank-you --all</div>
          <div style="color:var(--green-dk)">[ok] gratitude deployed</div>
        </div>

      <div class="sticker">early access: root</div>
    </div>

    <div class="sub" style="margin-top: 64px; font-weight: 700; color: var(--ink);">more soon. like, actually soon.</div>
    <div class="handle" style="margin-top: 20px;">@stateofsec</div>

</html>
