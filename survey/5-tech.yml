title: Tools & tech
label: tech
position: 5
questions:
  - label: Which offensive tools do you use at work or in labs / CTFs?
    required: false
    multiple: true
    showIf:
      question: roles-q-0
      in: [0, 1, 4, 8, 10, 11]
    choices:
      - Web & API testing (Burp Suite, Caido, ZAP, sqlmap, ffuf, Nuclei)
      - Recon & network (Nmap, subfinder, httpx, Shodan)
      - Exploitation & AD attacks (Metasploit, Cobalt Strike, Sliver, BloodHound, Impacket, NetExec)
      - Cracking & reversing (Hashcat, John the Ripper, Ghidra, IDA Pro)
      - Mobile testing (Frida, MobSF, objection)
      - Vulnerability scanning (Nessus, OpenVAS, Qualys)
      - None of these
      - Other
    exclusive: [None of these]
    optionShowIf:
      - options: ["Exploitation & AD attacks (Metasploit, Cobalt Strike, Sliver, BloodHound, Impacket, NetExec)"]
        showIf:
          question: roles-q-0
          notIn: [1, 4, 8]
      - options: ["Mobile testing (Frida, MobSF, objection)"]
        showIf:
          question: roles-q-0
          notEquals: 1
      # Everyone else lists scanners in the defensive question: no tool is counted twice
      - options: ["Vulnerability scanning (Nessus, OpenVAS, Qualys)"]
        showIf:
          question: roles-q-0
          equals: 0

  - label: Which defensive, engineering or GRC tools do you use (you or your team) at work or in labs?
    required: false
    multiple: true
    showIf:
      question: roles-q-0
      notEquals: 0
    choices:
      - SIEM & log analysis (Splunk, Microsoft Sentinel, Elastic / ELK, Wazuh, QRadar)
      - Network & firewalls (Fortinet, Palo Alto, Cisco, Check Point, Wireshark, Suricata, Zeek)
      - Endpoint & identity (CrowdStrike, Defender XDR, SentinelOne, Entra ID, CyberArk)
      - DFIR & threat intel (Velociraptor, Volatility, EnCase, TheHive, MISP, OpenCTI)
      - Vulnerability scanning, code & cloud (Nessus, OpenVAS, Qualys, SonarQube, Snyk, Semgrep, Wiz, Prowler)
      - GRC & risk platforms (Archer, ServiceNow, Egerie, CISO Assistant, spreadsheets)
      - None of these
      - Other
    exclusive: [None of these]
    optionShowIf:
      - options:
          - SIEM & log analysis (Splunk, Microsoft Sentinel, Elastic / ELK, Wazuh, QRadar)
          - Network & firewalls (Fortinet, Palo Alto, Cisco, Check Point, Wireshark, Suricata, Zeek)
        showIf:
          question: roles-q-0
          notIn: [4, 6, 9]
      - options:
          - Endpoint & identity (CrowdStrike, Defender XDR, SentinelOne, Entra ID, CyberArk)
          - DFIR & threat intel (Velociraptor, Volatility, EnCase, TheHive, MISP, OpenCTI)
        showIf:
          all:
            - question: roles-q-0
              notIn: [4, 6]
            - question: roles-q-0
              notEquals: 10
            - question: profile-q-4
              notEquals: 0
      - options: ["DFIR & threat intel (Velociraptor, Volatility, EnCase, TheHive, MISP, OpenCTI)"]
        showIf:
          question: roles-q-0
          in: [2, 3, 7, 10, 11]
      - options: ["GRC & risk platforms (Archer, ServiceNow, Egerie, CISO Assistant, spreadsheets)"]
        showIf:
          question: roles-q-0
          in: [6, 9]

  # stateofdev.ma
  - label: How often do you use AI tools for security work or study? (ChatGPT, Claude, Copilot...)
    required: true
    choices:
      - Daily
      - Occasionally
      - Tried them but not interested
      - Never

  - label: How do you use AI tools for security work or study?
    required: true
    multiple: true
    showIf:
      question: tech-q-2
      in: [0, 1]
    choices:
      - Research & learning
      - Writing or reviewing code / scripts
      - Report writing
      - Log / alert triage
      - Only where allowed (some work, clients or school forbid it)
      - Other

  # stateofdev.ma
  - label: Do you think AI will replace security jobs in the future?
    required: true
    choices:
      - Not very much (less than 10%)
      - Somewhat (10% - 30%)
      - To some extent (30% - 50%)
      - The majority (50% - 80%)
      - Completely (more than 80%)
      - Not sure
