title: Tools & tech
label: tech
position: 5
questions:
  - label: What is your primary operating system?
    required: true
    choices:
      - Windows
      - macOS
      - Linux-based
      - Windows + WSL2
      - Security-focused distro (Qubes, Tails, etc.)

  - label: Which offensive / pentest tools do you use regularly?
    required: false
    multiple: true
    showIf:
      question: roles-q-0
      in: [0, 1, 4, 5, 7, 8, 10]
    choices:
      - Burp Suite
      - Nmap
      - Metasploit
      - Cobalt Strike / Sliver / Mythic (C2)
      - BloodHound
      - Impacket
      - Ghidra / IDA Pro
      - sqlmap
      - ffuf / gobuster
      - Nuclei
      - Kali / Parrot toolset
      - Other

  - label: Which defensive / blue-team tools do you use?
    required: false
    multiple: true
    showIf:
      question: roles-q-0
      in: [2, 3, 5, 7, 8]
    choices:
      - Splunk
      - Elastic / ELK
      - Microsoft Sentinel
      - Wazuh
      - IBM QRadar
      - CrowdStrike
      - Microsoft Defender
      - SentinelOne
      - Suricata / Snort / Zeek
      - TheHive / MISP
      - Nessus / OpenVAS
      - Other

  - label: Which scripting / programming languages do you use for security work?
    required: true
    multiple: true
    choices:
      - Python
      - Bash / Shell
      - PowerShell
      - Go
      - C / C++
      - JavaScript / TypeScript
      - Rust
      - SQL
      - None
      - Other

  - label: How do you use AI tools in your security work?
    required: true
    multiple: true
    choices:
      - I don't use AI for security work
      - Research & learning
      - Writing scripts / tooling
      - Report writing
      - Log / alert triage
      - Code review
      - Other
