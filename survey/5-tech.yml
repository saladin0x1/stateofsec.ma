title: Tools & tech
label: tech
position: 5
questions:
  - label: Which offensive / pentest tools do you use or practice with?
    required: false
    multiple: true
    showIf:
      question: roles-q-0
      in: [0, 4, 5, 7, 8, 10]
    choices:
      - Burp Suite / Caido
      - Nmap
      - Metasploit
      - C2 frameworks (Cobalt Strike, Sliver, Mythic, Havoc)
      - AD tooling (BloodHound, Impacket, NetExec)
      - Ghidra / IDA Pro
      - sqlmap
      - ffuf / gobuster
      - Nuclei
      - Mobile (Frida, MobSF, objection)
      - None of these
      - Other

  - label: Which defensive / blue-team tools do you use?
    required: false
    multiple: true
    showIf:
      question: roles-q-0
      in: [1, 2, 3, 5, 7, 8]
    choices:
      - Splunk
      - Elastic / ELK
      - Microsoft Sentinel / Defender
      - IBM QRadar
      - Wazuh
      - Fortinet (FortiGate, FortiSIEM, FortiEDR)
      - Palo Alto (firewalls, Cortex XDR / XSOAR)
      - EDR (CrowdStrike, SentinelOne, Kaspersky, Trellix)
      - Suricata / Snort / Zeek
      - TheHive / MISP
      - Nessus / OpenVAS / Qualys
      - None of these
      - Other

  - label: Which scripting / programming languages do you use for security work?
    required: true
    multiple: true
    choices:
      - Python
      - Bash / Shell
      - PowerShell
      - Go
      - C / C++
      - JavaScript / TypeScript
      - Rust
      - SQL
      - KQL / SPL (SIEM query languages)
      - None
      - Other

  - label: How do you use AI tools for security work or study?
    required: true
    multiple: true
    choices:
      - I don't use AI for security work
      - Not allowed by my employer
      - Research & learning
      - Writing or reviewing code / scripts
      - Report writing
      - Log / alert triage
      - Other
