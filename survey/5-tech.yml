title: Tools & tech
label: tech
position: 5
questions:
  - label: Which offensive / pentest tools do you use or practice with?
    required: false
    multiple: true
    showIf:
      question: roles-q-0
      in: [0, 3, 4, 5, 7, 8, 10, 11]
    choices:
      - Burp Suite / Caido
      - Nmap
      - Metasploit
      - C2 frameworks (Cobalt Strike, Sliver, Mythic, Havoc)
      - AD tooling (BloodHound, Impacket, NetExec)
      - Ghidra / IDA Pro
      - sqlmap
      - ffuf / gobuster
      - Nuclei
      - Nessus / OpenVAS / Qualys
      - Mobile (Frida, MobSF, objection)
      - None of these
      - Other

  - label: Which defensive, engineering or GRC tools do you use or practice with?
    required: false
    multiple: true
    showIf:
      question: roles-q-0
      notEquals: 0
    choices:
      - Splunk
      - Elastic / ELK
      - Microsoft Sentinel / Defender
      - IBM QRadar
      - Wazuh
      - Fortinet (FortiGate, FortiSIEM, FortiEDR)
      - Other firewalls (Palo Alto, Cisco, Check Point, Sophos)
      - EDR (CrowdStrike, SentinelOne, Cortex XDR, Kaspersky, Trellix)
      - Network analysis (Wireshark, Suricata, Snort, Zeek)
      - DFIR & case tools (Velociraptor, Volatility, TheHive, MISP)
      - Nessus / OpenVAS / Qualys
      - Code & cloud security (SonarQube, Snyk, Semgrep, Wiz, Prowler, Trivy)
      - GRC / risk platform (Archer, ServiceNow, Egerie, etc.)
      - None of these
      - Other

  - label: How do you use AI tools for security work or study?
    required: true
    multiple: true
    choices:
      - I don't use AI for security work
      - Not allowed by my employer or clients
      - Research & learning
      - Writing or reviewing code / scripts
      - Report writing
      - Log / alert triage
      - Other
