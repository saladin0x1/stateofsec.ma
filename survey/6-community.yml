title: Community & reality
label: community
position: 6
questions:
  - label: How would you rate Morocco's overall cybersecurity maturity as a country?
    required: true
    choices:
      - Very weak
      - Weak
      - Average
      - Strong
      - Very strong
      - Not sure

  - label: Which of these rules have you dealt with in your work?
    required: false
    multiple: true
    showIf:
      question: profile-q-3
      notEquals: 0
    choices:
      - Law 05-20 on cybersecurity / DGSSI directives (DNSSI)
      - maCERT (national CERT)
      - Law 09-08 / CNDP (personal data)
      - Sector regulator directives (Bank Al-Maghrib, ACAPS, AMMC, ANRT)
      - EU rules through clients (GDPR, NIS2, DORA)
      - None of these
      - Other

  - label: How well does Moroccan law protect people who report security flaws in good faith?
    required: false
    choices:
      - Not at all
      - Poorly
      - Adequately
      - Well
      - Don't know

  - label: Apart from bug bounty or paid work, have you ever noticed a security flaw in a Moroccan organization's website, app or service while simply using it (as a customer, student or user)?
    required: false
    choices:
      - "Yes"
      - "No"
      - Prefer not to say

  - label: Did you report what you noticed?
    required: false
    showIf:
      question: community-q-3
      equals: 0
    choices:
      - "Yes"
      - Some, not all
      - "No"
      - Prefer not to say

  - label: Why did you not report (some of) them?
    required: false
    multiple: true
    showIf:
      question: community-q-4
      in: [1, 2]
    choices:
      - Didn't know how or where to report
      - Feared legal trouble
      - No clear or safe way to report
      - They wouldn't have fixed it anyway
      - Already fixed or reported by someone else
      - Not worth the effort
      - Prefer not to say

  - label: When you reported, what did you get back?
    required: false
    multiple: true
    showIf:
      question: community-q-4
      in: [0, 1]
    choices:
      - Thanked or credited
      - Rewarded (bounty, gift, job offer)
      - Fixed silently, no credit
      - Acknowledged, but not fixed
      - Ignored, no response
      - Went through maCERT, no follow-up
      - Told to stay quiet
      - A threat or legal warning
      - Prefer not to say

  - label: Have you ever been asked at work to hide or play down a security incident, or to soften a finding in an audit or pentest report? (a bug bounty program's normal disclosure rules don't count)
    required: false
    showIf:
      question: profile-q-3
      notEquals: 0
    choices:
      - Yes, it happened to me
      - Not to me, but I've seen it happen to others
      - "No"
      - Prefer not to say
