title: Learning & certifications
label: learning
position: 3
questions:
  - label: Do you hold any professional security certifications?
    required: true
    multiple: false
    choices:
      - "No"
      - Working on one
      - "Yes"

  - label: Which certifications do you hold?
    required: false
    multiple: true
    showIf:
      question: learning-q-0
      equals: 2
    choices:
      - CompTIA (Security+, CySA+, PenTest+)
      - CEH (Certified Ethical Hacker)
      - OSCP
      - Other OffSec (OSEP, OSWE, OSED, etc.)
      - Hands-on offensive (CRTP, CRTO, PNPT, BSCP)
      - INE / Hack The Box (eJPT, eCPPT, CPTS)
      - CISSP
      - CISM / CISA
      - ISO 27001 / 27005 / EBIOS RM
      - Network vendor (Fortinet NSE, Palo Alto, Cisco, Check Point)
      - Microsoft / cloud (SC-200, AZ-500, AWS, GCP)
      - Other

  - label: How did you learn cybersecurity? (select all that helped)
    required: true
    multiple: true
    choices:
      - University
      - Self-study (books, blogs, docs)
      - Online courses (Udemy, Coursera, etc.)
      - Hands-on labs (HTB, TryHackMe)
      - YouTube
      - CTFs / bug bounty
      - On-the-job / mentorship
      - Other
