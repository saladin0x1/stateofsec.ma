title: Learning & certifications
label: learning
position: 3
questions:
  - label: Do you hold any professional security certifications?
    required: true
    multiple: false
    choices:
      - "No"
      - Working on one
      - "Yes"

  - label: Which certifications do you hold?
    required: false
    multiple: true
    showIf:
      question: learning-q-0
      equals: 2
    choices:
      - CompTIA Security+
      - CEH (Certified Ethical Hacker)
      - OSCP
      - OSEP / OSWE / other Offensive Security
      - CISSP
      - CISM / CISA
      - ISO 27001 (Lead Auditor / Implementer)
      - GIAC (GSEC, GPEN, GCIH, etc.)
      - eLearnSecurity / INE (eJPT, eCPPT, etc.)
      - Cloud security (AWS / Azure / GCP)
      - Other

  - label: How did you primarily learn cybersecurity?
    required: true
    multiple: true
    choices:
      - University
      - Self-study (books, blogs, docs)
      - Online courses (Udemy, Coursera, etc.)
      - Hands-on labs (HTB, TryHackMe)
      - YouTube
      - CTFs / bug bounty
      - On-the-job / mentorship
      - Other
