title: Learning & certifications
label: learning
position: 3
questions:
  - label: Which security certifications do you hold?
    required: true
    multiple: true
    choices:
      - None yet
      - Entry-level / free (ISC2 CC, Google, Cisco NetAcad, Fortinet FCF)
      - CompTIA (Security+, CySA+, PenTest+)
      - CEH (Certified Ethical Hacker)
      - OSCP
      - Other OffSec (OSEP, OSWE, OSED, etc.)
      - Hands-on offensive (CRTP, CRTO, PNPT, BSCP)
      - INE / Hack The Box (eJPT, eCPPT, CPTS)
      - CISSP / CISM / CISA
      - ISO 27001 / 27005 / EBIOS RM
      - Network vendor certification (Fortinet NSE 4+, Palo Alto, Cisco, Check Point, Huawei)
      - Microsoft / cloud (SC-200, AZ-500, AWS, GCP)
      - Other
    exclusive: [None yet]
    optionShowIf:
      - options: [CISSP / CISM / CISA]
        showIf:
          question: profile-q-5
          in: [2, 3, 4, 5]
      - options: [ISO 27001 / 27005 / EBIOS RM]
        showIf:
          question: profile-q-4
          notEquals: 0

  - label: How did you learn cybersecurity? (select all that helped)
    required: true
    multiple: true
    choices:
      - University, engineering school, CPGE or OFPPT
      - Self-study (books, blogs, docs)
      - Courses & training (online or in person)
      - Hands-on labs (HTB, TryHackMe, PortSwigger Academy)
      - YouTube
      - CTFs / competitions
      - Bug bounty
      - Bootcamp / coding school (1337, YouCode, etc.)
      - Clubs / online communities
      - Mentorship
      - On-the-job
      - Other
    optionShowIf:
      # Under-18s skip education, but some have already started at OFPPT, a CPGE or university
      - options: ["University, engineering school, CPGE or OFPPT"]
        showIf:
          any:
            - question: profile-q-1
              equals: 0
            - question: profile-q-4
              in: [1, 2, 3, 5]
      - options: ["Bootcamp / coding school (1337, YouCode, etc.)"]
        showIf:
          question: profile-q-1
          notEquals: 0
      # Developers and sysadmins often learn security in their IT job
      - options: [On-the-job]
        showIf:
          any:
            - question: profile-q-5
              notEquals: 0
            - question: profile-q-6
              in: [0, 1, 2, 3, 4]
