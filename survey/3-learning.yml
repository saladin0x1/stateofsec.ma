title: Learning & certifications
label: learning
position: 3
questions:
  - label: Which security certifications do you hold?
    required: true
    multiple: true
    choices:
      - None yet
      - Entry-level / free (ISC2 CC, Google, Cisco NetAcad, Fortinet FCF)
      - CompTIA (Security+, CySA+, PenTest+)
      - CEH (Certified Ethical Hacker)
      - OSCP
      - Other OffSec (OSEP, OSWE, OSED, etc.)
      - Hands-on offensive (CRTP, CRTO, PNPT, BSCP)
      - INE / Hack The Box (eJPT, eCPPT, CPTS)
      - CISSP / CISM / CISA
      - ISO 27001 / 27005 / EBIOS RM
      - Network vendor certs (Fortinet NSE 4+, Palo Alto, Cisco, Check Point, Huawei)
      - Microsoft / cloud (SC-200, AZ-500, AWS, GCP)
      - Other
    exclusive: [None yet]
    optionShowIf:
      - options: [CISSP / CISM / CISA]
        showIf:
          question: profile-q-5
          in: [3, 4, 5, 6, 7]
      - options: [ISO 27001 / 27005 / EBIOS RM]
        showIf:
          question: profile-q-4
          notEquals: 0

  - label: How did you learn cybersecurity? (select all that helped)
    required: true
    multiple: true
    choices:
      - Lycée / school computer classes (informatique)
      - University, engineering school or CPGE
      - OFPPT or vocational training
      - Self-study / passion projects (books, blogs, docs, home lab)
      - Courses & training (online or in person)
      - Hands-on labs (HTB, TryHackMe, PortSwigger Academy)
      - YouTube
      - CTFs / competitions
      - Bug bounty
      - Bootcamp / coding school (1337, YouCode, etc.)
      - Clubs / online communities
      - Mentorship
      - On-the-job
      - Other
    optionShowIf:
      # Formal paths by age and education: teens learn at lycee or OFPPT (from about 15),
      # university or CPGE comes after the Bac
      - options: [Lycée / school computer classes (informatique)]
        showIf:
          any:
            - question: profile-q-1
              equals: 0
            - question: profile-q-4
              equals: 0
      - options: ["University, engineering school or CPGE"]
        showIf:
          question: profile-q-4
          in: [2, 3, 4, 5, 9]
      - options: [OFPPT or vocational training]
        showIf:
          any:
            - question: profile-q-1
              equals: 0
            - question: profile-q-4
              in: [2, 7, 9]
      - options: ["Bootcamp / coding school (1337, YouCode, etc.)"]
        showIf:
          question: profile-q-1
          notEquals: 0
      # Developers and sysadmins often learn security in their IT job
      - options: [On-the-job]
        showIf:
          any:
            - question: profile-q-5
              notEquals: 0
            - question: profile-q-6
              in: [0, 1, 2, 3, 4]

  # From stateofdev.ma
  - label: What languages can you read/write?
    required: true
    multiple: true
    choices:
      - Arabic
      - Amazigh
      - French
      - English
      - Others

  - label: What are your biggest challenges in learning security?
    required: true
    multiple: true
    max: 3
    choices:
      - Lack of time
      - Language barriers (English/French proficiency)
      - Cost of resources (labs, courses, certifications)
      - Lack of practical projects or labs
      - Information overload
      - No mentorship/guidance
      - Keeping up with rapid changes
      - Other
      - No particular challenge
    exclusive: [No particular challenge]
