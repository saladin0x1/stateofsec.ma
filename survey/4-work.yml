title: Work & market
label: work
position: 4
questions:
  - label: Your NET monthly income in Morocco (MAD) is
    required: false
    showIf:
      question: profile-q-5
      in: [0, 2, 3, 4]
    choices:
      - No income / unpaid
      - "< 5,000"
      - "5,000 - 8,000"
      - "8,000 - 12,000"
      - "12,000 - 16,000"
      - "16,000 - 20,000"
      - "20,000 - 30,000"
      - "30,000 - 40,000"
      - "> 40,000"
      - Prefer not to say

  - label: Your NET monthly income abroad (EUR or USD) is
    required: false
    showIf:
      question: profile-q-5
      equals: 1
    choices:
      - "< 2,000"
      - "2,000 - 3,000"
      - "3,000 - 4,000"
      - "4,000 - 5,000"
      - "5,000 - 7,000"
      - "7,000 - 10,000"
      - "> 10,000"
      - Prefer not to say

  - label: What type of organization do you work for or with?
    required: false
    showIf:
      question: profile-q-5
      in: [0, 1, 2, 3, 4, 7]
    choices:
      - Self-employed / independent (various clients)
      - Cybersecurity vendor / product company
      - Managed security service provider (MSSP / SOC)
      - IT services / consulting firm
      - Bank / financial services
      - Telecom / ISP
      - Government / public sector
      - Tech startup / e-commerce
      - Large enterprise (in-house security)
      - Other

  - label: What is holding you back from a security job right now?
    required: false
    multiple: true
    showIf:
      question: profile-q-5
      in: [5, 6]
    choices:
      - No entry-level roles
      - Need experience to get experience
      - Certifications too expensive
      - Few local opportunities
      - Not enough practical skills yet
      - Don't know where to look
      - Other

  - label: What is the biggest challenge in the Moroccan security job market?
    required: true
    multiple: true
    choices:
      - Low salaries compared to abroad
      - Brain drain (talent leaving)
      - Few senior roles
      - Few entry-level roles
      - Companies don't value security
      - Skills / experience gap
      - Costly certifications
      - Weak legal protection for researchers
