title: Work & market
label: work
position: 4
questions:
  - label: "Your usual NET monthly income in MAD (fixed allowances in, one-off bonuses out; bug bounty is asked separately; freelancers: average month; convert other currencies)"
    required: false
    showIf:
      question: profile-q-5
      in: [0, 2, 3, 4]
    choices:
      - No income / unpaid
      - "Less than 5,000"
      - "5,000 - 7,999"
      - "8,000 - 11,999"
      - "12,000 - 15,999"
      - "16,000 - 19,999"
      - "20,000 - 29,999"
      - "30,000 - 39,999"
      - "40,000 - 59,999"
      - "60,000 - 99,999"
      - "100,000 or more"
      - Prefer not to say

  - label: "Your NET monthly income in EUR (after income tax; one-off bonuses out; bug bounty is asked separately; convert other currencies)"
    required: false
    showIf:
      question: profile-q-5
      equals: 1
    choices:
      - "Less than 1,000"
      - "1,000 - 1,499"
      - "1,500 - 1,999"
      - "2,000 - 2,999"
      - "3,000 - 3,999"
      - "4,000 - 4,999"
      - "5,000 - 6,999"
      - "7,000 - 9,999"
      - "10,000 or more"
      - Prefer not to say

  - label: What type of organization do you work for?
    required: false
    showIf:
      question: profile-q-5
      in: [0, 1, 4]
    choices:
      - Security firm (MSSP / SOC, integrator, vendor)
      - Big Four / audit & advisory
      - IT services / ESN / nearshore (incl. regie placements)
      - Bank / insurance / fintech
      - Telecom / ISP
      - Public administration / state-owned company
      - Industry / energy / OT
      - Tech startup / e-commerce
      - Other company (in-house team)
      - Other

  - label: Where are most of your clients?
    required: false
    showIf:
      question: profile-q-5
      in: [2, 3]
    choices:
      - Morocco
      - France
      - Other Europe
      - Gulf
      - North America
      - Rest of Africa
      - Mostly bug bounty platforms
      - Mixed
      - No clients yet

  - label: About how much did you earn from bug bounty in the last 12 months? (USD, before tax)
    required: false
    showIf:
      question: roles-q-2
      in: [0, 1, 2]
    choices:
      - Nothing
      - "Less than $500"
      - "$500 - $1,999"
      - "$2,000 - $4,999"
      - "$5,000 - $19,999"
      - "$20,000 - $49,999"
      - "$50,000 or more"
      - Prefer not to say

  - label: What has made bug bounty harder for you, or kept you from starting, from Morocco?
    required: false
    multiple: true
    showIf:
      question: roles-q-2
      in: [0, 1, 2, 3]
    choices:
      - Nothing in particular
      - Found no valid bugs, duplicates or low payouts
      - No time alongside work or studies
      - Platform age limit or parental consent
      - ID (KYC) or tax-form checks
      - Usual payout (PayPal) unavailable, needed a workaround
      - Bank blocked, delayed or questioned a transfer
      - Unclear Office des Changes or tax rules
      - Fees and exchange-rate losses
      - No bank account in my own name
      - Few or no Moroccan programs
      - Something else

  - label: What makes it hard to get your first security job?
    required: false
    multiple: true
    showIf:
      question: profile-q-3
      equals: 0
    choices:
      - No entry-level roles
      - Need experience to get experience
      - Certifications too expensive
      - Few local opportunities
      - Hard to find an internship / PFE
      - Not enough practical skills yet
      - Don't know where to look
      - Still studying, not looking yet
      - Other

  # Same question for under-18s, who skip the experience question it is gated on.
  # Merge with work-q-6 at export.
  - label: What could make it hard to get your first security job later?
    required: false
    multiple: true
    showIf:
      question: profile-q-1
      equals: 0
    choices:
      - No entry-level roles
      - Need experience to get experience
      - Certifications too expensive
      - Few local opportunities
      - Hard to find an internship / PFE
      - Not enough practical skills yet
      - Don't know where to look
      - Still studying, not looking yet
      - Other

  - label: What are the biggest challenges in the Moroccan security job market? (pick up to 3)
    required: true
    multiple: true
    showIf:
      question: profile-q-4
      notEquals: 0
    choices:
      - Low salaries / talent leaving for abroad
      - Few senior roles
      - Few entry-level roles
      - Companies don't value security (no budget, left to IT staff)
      - Skills / experience gap
      - Costly certifications
      - Staffing / regie contracts instead of direct hiring
      - Recruiters filter on diploma (Bac+5) or age
      - Jobs concentrated in Casablanca / Rabat
      - Not sure
      - Other

  - label: In two years, where do you expect to be working?
    required: false
    choices:
      - In Morocco
      - In Morocco, remote for a foreign organization
      - Abroad for a few years, then back to Morocco
      - Abroad, long term
      - Abroad, not sure for how long
      - Still studying
      - Not sure
