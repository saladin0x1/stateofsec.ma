title: Work & market
label: work
position: 4
questions:
  # stateofdev.ma's MAD bands; interns get sub-bands of "< 4 000" and one top band, and the
  # top band is split for security seniors (every band nests into an upstream one)
  - label: "Net monthly income in MAD (employees: main job pay slip without 13th month, bonuses and side jobs; interns: stipend; founders: take-home after tax and charges; convert other currencies)"
    required: false
    showIf:
      all:
        - question: profile-q-6
          in: [0, 3, 4, 7]
        - question: profile-q-5
          notEquals: 0
    choices:
      - No income / unpaid
      - "< 1 500"
      - "1 500 - 2 500"
      - "2 500 - 4 000"
      - "< 4 000"
      - "4 000 - 6 000"
      - "6 000 - 8 000"
      - "> 8 000"
      - "8 000 - 10 000"
      - "10 000 - 12 000"
      - "12 000 - 14 000"
      - "14 000 - 16 000"
      - "16 000 - 18 000"
      - "18 000 - 20 000"
      - "20 000 - 22 000"
      - "22 000 - 25 000"
      - "25 000 - 30 000"
      - "30 000 - 40 000"
      - "40 000 - 60 000"
      - "60 000 - 100 000"
      - "> 100 000"
      - Prefer not to say
    optionShowIf:
      - options: [No income / unpaid]
        showIf:
          question: profile-q-6
          notEquals: 0
      - options: ["< 1 500", "1 500 - 2 500", "2 500 - 4 000", "> 8 000"]
        showIf:
          question: profile-q-6
          equals: 4
      - options:
          - "< 4 000"
          - "8 000 - 10 000"
          - "10 000 - 12 000"
          - "12 000 - 14 000"
          - "14 000 - 16 000"
          - "16 000 - 18 000"
          - "18 000 - 20 000"
          - "20 000 - 22 000"
          - "22 000 - 25 000"
          - "25 000 - 30 000"
          - "30 000 - 40 000"
          - "40 000 - 60 000"
          - "60 000 - 100 000"
          - "> 100 000"
        showIf:
          question: profile-q-6
          notEquals: 4

  # stateofdev.ma: freelancers in Morocco give a daily rate (TJM)
  - label: Usual daily rate (TJM) in MAD, before tax (convert other currencies; excl. bug bounty)
    required: false
    showIf:
      all:
        - question: profile-q-6
          equals: 2
        - question: profile-q-5
          notEquals: 0
        - question: profile-q-2
          notIn: [12, 13, 14, 15]
    choices:
      - "< 1 000"
      - "1 000 - 1 500"
      - "1 500 - 2 000"
      - "2 000 - 2 500"
      - "2 500 - 3 000"
      - "3 000 - 4 000"
      - "4 000 - 5 000"
      - "> 5 000"
      - I don't bill by the day (e.g. full-time bug bounty)
      - Prefer not to say

  # stateofdev.ma: work for a foreign organization is asked as gross yearly USD
  - label: Gross yearly salary in USD, before tax (convert other currencies; excl. bug bounty)
    required: false
    showIf:
      all:
        - question: profile-q-6
          equals: 1
        - question: profile-q-5
          notEquals: 0
    choices:
      - "< 20 000"
      - "20 000 - 25 000"
      - "25 000 - 30 000"
      - "30 000 - 40 000"
      - "40 000 - 50 000"
      - "50 000 - 60 000"
      - "60 000 - 80 000"
      - "80 000 - 100 000"
      - "100 000 - 120 000"
      - "120 000 - 150 000"
      - "150 000 - 200 000"
      - "> 200 000"
      - Prefer not to say

  - label: Usual daily rate in USD, before tax (convert other currencies; excl. bug bounty)
    required: false
    showIf:
      all:
        - question: profile-q-6
          equals: 2
        - question: profile-q-5
          notEquals: 0
        - question: profile-q-2
          in: [12, 13, 14, 15]
    choices:
      - "< 200"
      - "200 - 500"
      - "500 - 1 000"
      - "1 000 - 2 000"
      - "2 000 - 3 000"
      - "3 000 - 5 000"
      - "5 000 - 10 000"
      - "> 10 000"
      - I don't bill by the day (e.g. full-time bug bounty)
      - Prefer not to say

  - label: What type of organization do you work for (or run)?
    required: false
    showIf:
      all:
        - question: profile-q-6
          in: [0, 1, 3, 4]
        - question: profile-q-5
          notEquals: 0
    choices:
      - Security firm (MSSP / SOC, pentest or consulting firm, integrator, vendor)
      - Big Four / audit & advisory
      - IT services / ESN / nearshore (incl. regie placements)
      - Bank / insurance / fintech
      - Telecom / ISP
      - Public administration
      - State-owned company / public establishment (OCP, ONEE, CDG, etc.)
      - Industry / energy / OT
      - Tech / software company (startup to big tech, e-commerce)
      - Other company (in-house team)
      - Other
    optionShowIf:
      # Founders run a company: only the kinds a founder can run
      - options:
          - Big Four / audit & advisory
          - Bank / insurance / fintech
          - Telecom / ISP
          - Public administration
          - State-owned company / public establishment (OCP, ONEE, CDG, etc.)
          - Industry / energy / OT
          - Other company (in-house team)
        showIf:
          question: profile-q-6
          notEquals: 3

  - label: Where are most of your clients?
    required: false
    showIf:
      all:
        - question: profile-q-6
          in: [2, 3]
        - question: profile-q-5
          notEquals: 0
    choices:
      - Morocco
      - France
      - Other Europe
      - Gulf
      - North America
      - Rest of Africa
      - Mostly bug bounty platforms
      - Mixed
      - No clients yet
    optionShowIf:
      - options: [Mostly bug bounty platforms]
        showIf:
          all:
            - question: profile-q-6
              equals: 2
            - question: roles-q-2
              in: [0, 1]

  # stateofdev.ma work conditions
  - label: What remote work arrangement does your current employer offer?
    required: false
    showIf:
      question: profile-q-6
      in: [0, 1, 4]
    choices:
      - Back to office
      - Full remote
      - Hybrid

  - label: How often do you work beyond normal hours?
    required: false
    showIf:
      question: profile-q-6
      in: [0, 1, 2, 3, 4, 7]
    choices:
      - Never
      - "Rarely: 1-2 days per year or less"
      - "Occasionally: 1-2 days per quarter but less than monthly"
      - "Sometimes: 1-2 days per month but less than weekly"
      - "Often: 1-2 days per week or more"
      - "Very often: 3-5 days per week"
      - Daily

  - label: How do you feel about your job?
    required: false
    showIf:
      question: profile-q-6
      in: [0, 1, 2, 3, 4, 7]
    choices:
      - Very unsatisfied
      - Slightly unsatisfied
      - Neither satisfied nor unsatisfied
      - Slightly satisfied
      - Very satisfied

  - label: Bug bounty earnings in the last 12 months? (USD before tax; convert EUR)
    required: false
    showIf:
      question: roles-q-2
      in: [0, 1, 2]
    choices:
      - Nothing
      - No cash, only swag / points / Hall of Fame
      - "Less than $500"
      - "$500 - $1,999"
      - "$2,000 or more"
      - "$2,000 - $4,999"
      - "$5,000 - $19,999"
      - "$20,000 - $49,999"
      - "$50,000 or more"
      - Prefer not to say
    optionShowIf:
      # Minors get one top band, so top teen hunters cannot be singled out in the published data
      - options: ["$2,000 or more"]
        showIf:
          question: profile-q-1
          equals: 0
      - options: ["$2,000 - $4,999", "$5,000 - $19,999", "$20,000 - $49,999", "$50,000 or more"]
        showIf:
          question: profile-q-1
          notEquals: 0

  - label: What made bug bounty harder, made you stop, or kept you from starting?
    required: false
    multiple: true
    showIf:
      question: roles-q-2
      in: [0, 1, 2, 3]
    choices:
      - Nothing in particular
      - Don't feel ready yet / don't know where to start
      - Found no valid bugs, duplicates or low payouts
      - No time alongside work or studies
      - Worried about legal trouble / unsure what is allowed to test
      - Family or school against it
      - Platform age limit or parental consent
      - ID (KYC) or tax-form checks
      - Usual payout method (e.g. PayPal) not available in Morocco
      - Bank blocked, delayed or questioned a transfer
      - Unclear Office des Changes or tax rules
      - Fees and exchange-rate losses
      - No bank account in my own name
      - Few or no Moroccan programs
      - Something else
    exclusive: [Nothing in particular]
    optionShowIf:
      - options: [Don't feel ready yet / don't know where to start]
        showIf:
          question: roles-q-2
          in: [2, 3]
      - options: ["Found no valid bugs, duplicates or low payouts", Fees and exchange-rate losses]
        showIf:
          question: roles-q-2
          notEquals: 3
      - options: [Family or school against it, Platform age limit or parental consent, No bank account in my own name]
        showIf:
          question: profile-q-1
          in: [0, 1]
      - options: [Usual payout method (e.g. PayPal) not available in Morocco, "Bank blocked, delayed or questioned a transfer"]
        showIf:
          all:
            - question: roles-q-2
              notEquals: 3
            - question: profile-q-2
              notIn: [12, 13, 14, 15]
      - options: [Unclear Office des Changes or tax rules]
        showIf:
          question: profile-q-2
          notIn: [12, 13, 14, 15]

  # stateofdev.ma
  - label: How long have you been unemployed after graduation?
    required: false
    showIf:
      question: profile-q-4
      notEquals: 0
    choices:
      - None, I worked straight after my graduation
      - Up to 3 months
      - Up to 6 months
      - Up to 1 year
      - More than 1 year
      - Not graduated yet

  - label: What makes it hard to get your first (or next) security job?
    required: false
    multiple: true
    showIf:
      any:
        - question: profile-q-5
          equals: 0
        - question: profile-q-6
          in: [4, 5, 6]
    choices:
      - No entry-level roles
      - Need experience to get experience
      - Few roles or offers at my level or pay
      - Certifications too expensive
      - Few local opportunities in Morocco
      - Hard to find a security internship / PFE
      - Not enough practical skills yet
      - Recruiters filter on diploma or age
      - Jobs go through referrals / personal network
      - "Switching from IT / dev: pay cut, or that experience is not counted"
      - Don't know where to look
      - Still studying, not looking yet
      - Not looking for a security job
      - Other
    exclusive: [Not looking for a security job]
    optionShowIf:
      - options: [No entry-level roles, Need experience to get experience]
        showIf:
          question: profile-q-5
          in: [0, 1, 2]
      - options: [Few roles or offers at my level or pay]
        showIf:
          question: profile-q-5
          in: [3, 4, 5, 6, 7]
      - options: [Hard to find a security internship / PFE]
        showIf:
          all:
            - question: profile-q-6
              in: [4, 5, 6, 7]
            - question: profile-q-5
              in: [0, 1, 2]
      - options: ["Switching from IT / dev: pay cut, or that experience is not counted"]
        showIf:
          question: profile-q-6
          notIn: [4, 5]
      - options: ["Still studying, not looking yet"]
        showIf:
          question: profile-q-6
          equals: 5
      - options: [Not looking for a security job]
        showIf:
          question: profile-q-6
          notIn: [5, 6]

  - label: What are the biggest challenges in the Moroccan security job market?
    required: true
    multiple: true
    max: 3
    showIf:
      question: profile-q-4
      notEquals: 0
    choices:
      - Low salaries / talent leaving for abroad
      - Few senior roles
      - Few entry-level roles
      - Companies don't value security (no budget, left to IT staff)
      - Skills / experience gap
      - Costly certifications
      - Staffing / regie contracts instead of direct hiring
      - Recruiters filter on diploma (Bac+5) or age
      - Jobs concentrated in Casablanca / Rabat
      - Winning or getting paid for contracts (tenders, late payment, undercutting)
      - Not sure
      - Other
    optionShowIf:
      - options: ["Winning or getting paid for contracts (tenders, late payment, undercutting)"]
        showIf:
          question: profile-q-6
          in: [2, 3]

  # stateofdev.ma job preferences
  - label: What would most influence your choice between job offers?
    required: false
    multiple: true
    showIf:
      question: profile-q-4
      notEquals: 0
    choices:
      - Technologies and tools I'd be working with
      - Office environment or company culture
      - Flexible time or schedule
      - Opportunities for professional development
      - Remote work options
      - How impactful my work would be
      - The industry I'd be working in
      - Company paid training and certifications
      - Salary
      - Stock options / equity
      - Benefits package (health insurance, pension, etc.)
      - Work-life balance
      - Company mission / values alignment
      - Visa / relocation support

  - label: What type of company do you prefer?
    required: false
    showIf:
      question: profile-q-4
      notEquals: 0
    choices:
      - Self-employed
      - Company under 10 employees
      - Company between 11 and 30 employees
      - Company between 31 and 100 employees
      - Company above 100 employees
      - Other

  - label: What is your preferred mode of work?
    required: false
    showIf:
      question: profile-q-4
      notEquals: 0
    choices:
      - From the office
      - Full remote
      - Part-time remote / Hybrid

  # stateofdev.ma's emigration questions (teens and lycee students get the last one instead)
  - label: Do you have any plans to work outside Morocco?
    required: true
    showIf:
      question: profile-q-4
      notEquals: 0
    choices:
      - Yes, in the next 12 months
      - Yes, in the next 24 months
      - Still hesitating
      - Currently working outside Morocco
      - "No"

  - label: If you work abroad, do you plan to return to Morocco?
    required: false
    showIf:
      question: work-q-17
      equals: 3
    choices:
      - Yes, within the next 12 months
      - Yes, within the next 24 months
      - Yes, but not in the near future
      - Still hesitating
      - No, I plan to stay abroad

  - label: After your studies, where would you like to work?
    required: false
    showIf:
      any:
        - question: profile-q-1
          equals: 0
        - question: profile-q-4
          equals: 0
    choices:
      - In Morocco
      - In Morocco, remote for foreign employers or clients
      - Abroad for a few years, then back to Morocco
      - Abroad, long term
      - Not sure yet
