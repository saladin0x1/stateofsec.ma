title: Work & market
label: work
position: 4
questions:
  - label: "Your usual NET monthly income in MAD (salaries: fixed allowances in, one-off bonuses out; freelancers and founders: what you take home in an average month; bug bounty is asked separately; convert other currencies)"
    required: false
    showIf:
      all:
        - question: profile-q-5
          in: [0, 2, 3, 4, 7]
        - question: profile-q-4
          notEquals: 0
    choices:
      - No income / unpaid
      - "Less than 1,500"
      - "1,500 - 2,999"
      - "3,000 - 4,999"
      - "Less than 5,000"
      - "5,000 - 7,999"
      - "8,000 or more"
      - "8,000 - 11,999"
      - "12,000 - 15,999"
      - "16,000 - 19,999"
      - "20,000 - 29,999"
      - "30,000 - 39,999"
      - "40,000 - 59,999"
      - "60,000 - 99,999"
      - "100,000 or more"
      - Prefer not to say
    optionShowIf:
      - options: [No income / unpaid]
        showIf:
          question: profile-q-5
          notEquals: 0
      # Interns get finer stipend bands and a single top band
      - options: ["Less than 1,500", "1,500 - 2,999", "3,000 - 4,999", "8,000 or more"]
        showIf:
          question: profile-q-5
          equals: 4
      - options:
          - "Less than 5,000"
          - "8,000 - 11,999"
          - "12,000 - 15,999"
          - "16,000 - 19,999"
          - "20,000 - 29,999"
          - "30,000 - 39,999"
          - "40,000 - 59,999"
          - "60,000 - 99,999"
          - "100,000 or more"
        showIf:
          question: profile-q-5
          notEquals: 4

  - label: "Your NET monthly take-home pay in EUR (after tax and social charges; one-off bonuses out; bug bounty is asked separately; convert other currencies)"
    required: false
    showIf:
      all:
        - question: profile-q-5
          equals: 1
        - question: profile-q-4
          notEquals: 0
    choices:
      - "Less than 1,000"
      - "1,000 - 1,499"
      - "1,500 - 1,999"
      - "2,000 - 2,999"
      - "3,000 - 3,999"
      - "4,000 - 4,999"
      - "5,000 - 6,999"
      - "7,000 - 9,999"
      - "10,000 or more"
      - Prefer not to say

  - label: What type of organization do you work for?
    required: false
    showIf:
      all:
        - question: profile-q-5
          in: [0, 1, 4]
        - question: profile-q-4
          notEquals: 0
    choices:
      - Security firm (MSSP / SOC, integrator, vendor)
      - Big Four / audit & advisory
      - IT services / ESN / nearshore (incl. regie placements)
      - Bank / insurance / fintech
      - Telecom / ISP
      - Public sector / state-owned company
      - Industry / energy / OT
      - Tech startup / e-commerce
      - Other company (in-house team)
      - Other

  - label: Where are most of your clients?
    required: false
    showIf:
      question: profile-q-5
      in: [2, 3]
    choices:
      - Morocco
      - France
      - Other Europe
      - Gulf
      - North America
      - Rest of Africa
      - Mostly bug bounty platforms
      - Mixed
      - No clients yet
    optionShowIf:
      - options: [Mostly bug bounty platforms]
        showIf:
          question: profile-q-5
          equals: 2

  - label: About how much did you earn from bug bounty in the last 12 months? (USD before tax; convert EUR)
    required: false
    showIf:
      question: roles-q-2
      in: [0, 1, 2]
    choices:
      - Nothing
      - "Less than $500"
      - "$500 - $1,999"
      - "$2,000 - $4,999"
      - "$5,000 - $19,999"
      - "$20,000 - $49,999"
      - "$50,000 or more"
      - Prefer not to say

  - label: What has made bug bounty harder for you, made you stop, or kept you from starting?
    required: false
    multiple: true
    showIf:
      question: roles-q-2
      in: [0, 1, 2, 3]
    choices:
      - Nothing in particular
      - Don't feel ready yet / don't know where to start
      - Found no valid bugs, duplicates or low payouts
      - No time alongside work or studies
      - Platform age limit or parental consent
      - ID (KYC) or tax-form checks
      - Usual payout (PayPal) unavailable, needed a workaround
      - Bank blocked, delayed or questioned a transfer
      - Unclear Office des Changes or tax rules
      - Fees and exchange-rate losses
      - No bank account in my own name
      - Few or no Moroccan programs
      - Something else
    exclusive: [Nothing in particular]
    optionShowIf:
      - options: [Don't feel ready yet / don't know where to start]
        showIf:
          question: roles-q-2
          in: [2, 3]
      - options: ["Found no valid bugs, duplicates or low payouts", Fees and exchange-rate losses]
        showIf:
          question: roles-q-2
          notEquals: 3
      - options: [Platform age limit or parental consent, No bank account in my own name]
        showIf:
          question: profile-q-1
          in: [0, 1]
      - options: ["Usual payout (PayPal) unavailable, needed a workaround", "Bank blocked, delayed or questioned a transfer"]
        showIf:
          all:
            - question: roles-q-2
              notEquals: 3
            - question: profile-q-2
              notEquals: 7
      - options: [Unclear Office des Changes or tax rules]
        showIf:
          question: profile-q-2
          notEquals: 7

  - label: What makes it hard to get your first (or next) security job?
    required: false
    multiple: true
    showIf:
      any:
        - question: profile-q-4
          equals: 0
        - question: profile-q-5
          equals: 6
    choices:
      - No entry-level roles
      - Need experience to get experience
      - Certifications too expensive
      - Few local opportunities in Morocco
      - Hard to find an internship / PFE
      - Not enough practical skills yet
      - Don't know where to look
      - Still studying, not looking yet
      - Not looking for a security job
      - Other
    exclusive: [Not looking for a security job]
    optionShowIf:
      - options: [Hard to find an internship / PFE]
        showIf:
          question: profile-q-5
          in: [5, 6, 7]
      - options: ["Still studying, not looking yet"]
        showIf:
          question: profile-q-5
          equals: 5
      - options: [Not looking for a security job]
        showIf:
          question: profile-q-5
          notIn: [5, 6]

  - label: What are the biggest challenges in the Moroccan security job market? (pick up to 3)
    required: true
    multiple: true
    showIf:
      question: profile-q-3
      notEquals: 0
    choices:
      - Low salaries / talent leaving for abroad
      - Few senior roles
      - Few entry-level roles
      - Companies don't value security (no budget, left to IT staff)
      - Skills / experience gap
      - Costly certifications
      - Staffing / regie contracts instead of direct hiring
      - Recruiters filter on diploma (Bac+5) or age
      - Jobs concentrated in Casablanca / Rabat
      - Not sure
      - Other

  - label: In two years, where do you expect to be working?
    required: false
    showIf:
      question: profile-q-3
      notEquals: 0
    choices:
      - In Morocco
      - In Morocco, remote for a foreign organization
      - Abroad for a few years, then back to Morocco
      - Abroad, long term
      - Abroad, not sure for how long
      - Still studying
      - Not sure
    optionShowIf:
      - options: [Still studying]
        showIf:
          question: profile-q-5
          equals: 5

  - label: After your studies, where would you like to work?
    required: false
    showIf:
      any:
        - question: profile-q-1
          equals: 0
        - question: profile-q-3
          equals: 0
    choices:
      - In Morocco
      - In Morocco, remote for a foreign organization
      - Abroad for a few years, then back to Morocco
      - Abroad, long term
      - Not sure yet
