title: Profile
label: profile
position: 1
questions:
  - label: What is your gender?
    required: true
    multiple: false
    choices:
      - Male
      - Female

  - label: What is your age?
    required: true
    choices:
      - Younger than 18
      - 18 to 24
      - 25 to 34
      - 35 to 44
      - 45 or older

  - label: Where are you based?
    required: true
    choices:
      - Casablanca-Settat
      - Rabat-Salé-Kénitra
      - Marrakech-Safi
      - Tanger-Tétouan-Al Hoceïma
      - Fès-Meknès
      - Souss-Massa
      - Other region in Morocco
      - Abroad

  - label: How many years of experience do you have in cybersecurity?
    required: true
    choices:
      - No professional experience yet
      - Less than 2 years
      - 2-4 years
      - 5-7 years
      - 8-11 years
      - 12+ years

  - label: What is your educational background (highest, completed or in progress)?
    required: true
    choices:
      - Self-taught (no formal degree in the field)
      - University / public school - Bac +2/+3 (incl. BTS, OFPPT / ISTA)
      - University / public school - Bac +5 or higher (engineering, Master's, PhD)
      - Private engineering or tech school
      - Coding school (1337, YouCode, Solicode, etc.)
      - Dedicated cybersecurity program or academy
      - Other

  - label: What is your current employment situation?
    required: true
    multiple: false
    choices:
      - Employee of an organization in Morocco (incl. nearshore centers)
      - Employee of a foreign organization (abroad, or remote from Morocco)
      - Freelancer / independent (self-employed)
      - Founder or running my own company
      - Internship or apprenticeship (incl. PFE)
      - Student (not working)
      - Looking for work
      - Other
