title: Profile
label: profile
position: 1
questions:
  - label: What is your gender?
    required: true
    multiple: false
    choices:
      - Male
      - Female

  - label: What is your age?
    required: true
    choices:
      - Younger than 18 years
      - 18 to 24 years
      - 25 to 34 years
      - 35 to 44 years
      - 45 or older

  - label: Where are you currently located?
    required: true
    choices:
      - Rabat-Salé-Kénitra
      - Casablanca-Settat
      - Marrakech-Safi
      - Tanger-Tétouan-Al Hoceïma
      - "L'Oriental"
      - Fès-Meknès
      - Béni Mellal-Khénifra
      - Drâa-Tafilalet
      - Souss-Massa
      - Guelmim-Oued Noun
      - Laâyoune-Sakia El Hamra
      - Dakhla-Oued Ed Dahab
      - Europe
      - "US & Canada"
      - Middle East
      - Other African country
      - Other

  - label: Which best describes you?
    required: true
    choices:
      - Working professional in cybersecurity
      - IT or developer moving into security
      - Student learning cybersecurity
      - Researcher or academic
      - Hobbyist or enthusiast
      - Looking for my first security role

  - label: How many years of experience do you have in cybersecurity?
    required: true
    choices:
      - No professional experience yet
      - Less than a year
      - 1-2 years
      - 3-4 years
      - 5-6 years
      - 7-10 years
      - 11-15 years
      - 16+ years

  - label: What is your educational background?
    required: true
    choices:
      - Self-taught (no formal degree in the field)
      - University/public school - Bac +2/+3
      - University/public school - Bac +5 (engineering/Master's)
      - University/public school - Bac +8 (Doctoral)
      - Private engineering or tech school
      - Coding school (1337, YouCode, Solicode, etc.)
      - Dedicated cybersecurity program or academy
      - Diploma in another field (career switch)
      - Other

  - label: What is your current employment situation?
    required: true
    choices:
      - Full-time employee in Morocco
      - Full-time employee abroad
      - Freelancer or consultant
      - Founder or running my own company
      - Internship or apprenticeship
      - Student (not working)
      - Looking for work
      - Other

  - label: Do you have plans to work outside Morocco?
    required: true
    choices:
      - Yes, in the next 12 months
      - Yes, in the next 24 months
      - Still hesitating
      - Already working abroad
      - No
