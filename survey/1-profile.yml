title: Profile
label: profile
position: 1
questions:
  - label: What is your gender?
    required: true
    multiple: false
    choices:
      - Male
      - Female

  - label: What is your age?
    required: true
    choices:
      - Younger than 18
      - 18 to 24
      - 25 to 34
      - 35 to 44
      - 45 or older

  # The 12 official regions, in official order
  - label: Where are you based?
    required: true
    choices:
      - Tanger-Tétouan-Al Hoceïma
      - "L'Oriental"
      - Fès-Meknès
      - Rabat-Salé-Kénitra
      - Béni Mellal-Khénifra
      - Casablanca-Settat
      - Marrakech-Safi
      - Drâa-Tafilalet
      - Souss-Massa
      - Guelmim-Oued Noun
      - Laâyoune-Sakia El Hamra
      - Dakhla-Oued Ed-Dahab
      - Abroad

  - label: Which country are you based in?
    required: true
    showIf:
      question: profile-q-2
      equals: 12
    choices:
      - France
      - Belgium, Netherlands or Luxembourg
      - Germany, Switzerland or Austria
      - Spain, Italy or Portugal
      - UK or Ireland
      - Other European country
      - Canada
      - United States
      - United Arab Emirates
      - Saudi Arabia, Qatar or another Gulf country
      - Another African country
      - Other country

  - label: What is your highest level of education (completed or in progress)?
    required: true
    showIf:
      question: profile-q-1
      notEquals: 0
    choices:
      - Still at lycée / preparing the Bac (incl. repeating or candidat libre)
      - Bac or lower, no longer at lycée (incl. OFPPT Qualification / Technicien)
      - Bac+2 / Bac+3 (BTS, DUT, OFPPT Technicien Spécialisé, Licence)
      - Bac+5 or higher (engineering, Master's, business school, PhD)
      - Coding school, bootcamp or academy only (1337, YouCode, etc.)
      - Other
    optionShowIf:
      # Only 18-24 can still be at lycee; older respondents preparing the Bac pick "Bac or lower"
      - options: [Still at lycée / preparing the Bac (incl. repeating or candidat libre)]
        showIf:
          question: profile-q-1
          equals: 1

  - label: How many years has security been part or all of your job? (jobs, freelance, internships; bug bounty only if it is your main income)
    required: true
    showIf:
      question: profile-q-4
      notEquals: 0
    choices:
      - None yet (security has not been part of my job)
      - Less than 2 years (incl. a current internship)
      - 2-4 years
      - 5-7 years
      - 8-11 years
      - 12+ years
    optionShowIf:
      - options: [8-11 years, 12+ years]
        showIf:
          question: profile-q-1
          notEquals: 1

  - label: What is your current employment situation?
    required: true
    multiple: false
    showIf:
      question: profile-q-4
      notEquals: 0
    choices:
      - Employee of an organization in Morocco (public or private, incl. nearshore)
      - Employee of a foreign organization (abroad, or remote from Morocco, incl. via an employer-of-record)
      - Freelancer / independent (incl. full-time bug bounty and contracting for foreign clients)
      - Founder or running my own company
      - Internship or apprenticeship (incl. PFE, ANAPEC / Idmaj contract)
      - Student (school, university, 1337, OFPPT; if you also work, pick your job)
      - Looking for work
      - Other
