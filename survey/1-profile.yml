title: Profile
label: profile
position: 1
questions:
  - label: What is your gender?
    required: true
    multiple: false
    choices:
      - Male
      - Female

  - label: What is your age?
    required: true
    choices:
      - Younger than 18 years
      - 18 to 24 years
      - 25 to 34 years
      - 35 to 44 years
      - 45 or older

  # Same list as stateofdev.ma (12 official regions + 4 areas abroad), so results compare
  - label: Where are you currently located?
    required: true
    choices:
      - Rabat-Salé-Kénitra
      - Casablanca-Settat
      - Marrakech-Safi
      - Tanger-Tétouan-Al Hoceïma
      - "L'Oriental"
      - Fès-Meknès
      - Béni Mellal-Khénifra
      - Drâa-Tafilalet
      - Souss-Massa
      - Guelmim-Oued Noun
      - Laâyoune-Sakia El Hamra
      - Dakhla-Oued Ed Dahab
      - Europe
      - "US & Canada"
      - Middle East
      - Others

  - label: Which country?
    required: true
    showIf:
      question: profile-q-2
      in: [12, 13, 14, 15]
    choices:
      - France
      - Belgium, Netherlands or Luxembourg
      - Germany, Switzerland or Austria
      - Spain, Italy or Portugal
      - UK or Ireland
      - Other European country
      - Canada
      - United States
      - United Arab Emirates
      - Saudi Arabia
      - Qatar
      - Other Middle East country
      - Africa (outside Morocco)
      - Asia or Oceania
      - Other country
    optionShowIf:
      - options:
          - France
          - Belgium, Netherlands or Luxembourg
          - Germany, Switzerland or Austria
          - Spain, Italy or Portugal
          - UK or Ireland
          - Other European country
        showIf:
          question: profile-q-2
          equals: 12
      - options: [Canada, United States]
        showIf:
          question: profile-q-2
          equals: 13
      - options: [United Arab Emirates, Saudi Arabia, Qatar, Other Middle East country]
        showIf:
          question: profile-q-2
          equals: 14
      - options: [Africa (outside Morocco), Asia or Oceania, Other country]
        showIf:
          question: profile-q-2
          equals: 15

  # stateofdev.ma's education list, plus the lycee fork
  - label: What is/was your IT or security education background? (completed or in progress)
    required: true
    showIf:
      question: profile-q-1
      notEquals: 0
    choices:
      - Still at lycée / preparing the Bac (incl. repeating or candidat libre)
      - Self-taught (no formal IT or security education)
      - University/Public school - Bac +2/+3 (Bachelor's)
      - University/Public school - Bac +5 (Master's)
      - University/Public school - Bac +8 (Doctoral)
      - Private engineering/tech school
      - Coding school (1337, YouCode, Solicode, etc.)
      - Vocational/Technical training (OFPPT, etc.)
      - Other field's diploma (career transition)
      - Other
    optionShowIf:
      # Only 18-24 can still be at lycee; older respondents preparing the Bac pick another answer
      - options: [Still at lycée / preparing the Bac (incl. repeating or candidat libre)]
        showIf:
          question: profile-q-1
          equals: 1

  # stateofdev.ma's experience bands
  - label: How many years has security been part or all of your job? (jobs, freelance, internships; bug bounty only if it is your main income)
    required: true
    showIf:
      question: profile-q-4
      notEquals: 0
    choices:
      - None yet (security has not been part of my job)
      - Less than a year (incl. a current internship)
      - 1-2 years
      - 3-4 years
      - 5-6 years
      - 7-10 years
      - 11-16 years
      - 16+ years
    optionShowIf:
      - options: [11-16 years, 16+ years]
        showIf:
          question: profile-q-1
          notEquals: 1

  - label: What is your current employment situation?
    required: true
    multiple: false
    showIf:
      question: profile-q-4
      notEquals: 0
    choices:
      - Employee of an organization in Morocco (public or private, incl. nearshore)
      - Employee of a foreign organization (abroad, or remote from Morocco, incl. via an employer-of-record)
      - Freelancer / independent (incl. full-time bug bounty and contracting for foreign clients)
      - Founder or running my own company
      - Internship or apprenticeship (incl. PFE, ANAPEC / Idmaj contract)
      - Student (school, university, 1337, OFPPT; if you also work, pick your job)
      - Looking for work
      - Other
