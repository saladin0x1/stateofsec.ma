title: Profile
label: profile
position: 1
questions:
  - label: What is your gender?
    required: true
    multiple: false
    choices:
      - Male
      - Female

  - label: What is your age?
    required: true
    choices:
      - Younger than 18
      - 18 to 24
      - 25 to 34
      - 35 to 44
      - 45 or older

  - label: Where are you based?
    required: true
    choices:
      - Casablanca-Settat
      - Rabat-Salé-Kénitra
      - Marrakech-Safi
      - Tanger-Tétouan-Al Hoceïma
      - Fès-Meknès
      - Souss-Massa
      - Other region in Morocco
      - Abroad

  - label: How many years has security been part or all of your job? (jobs, freelance, internships; bug bounty not counted)
    required: true
    choices:
      - No professional experience yet
      - Less than 2 years
      - 2-4 years
      - 5-7 years
      - 8-11 years
      - 12+ years

  - label: What is your highest level of education (completed or in progress)?
    required: true
    choices:
      - Still at lycée / high school
      - Bac or lower (finished studies)
      - Bac+2 / Bac+3 (BTS, DUT, OFPPT / ISTA, Licence)
      - Bac+5 or higher (engineering, Master's, business school, PhD)
      - Coding school, bootcamp or academy only (1337, YouCode, etc.)
      - Other

  - label: What is your current employment situation?
    required: true
    multiple: false
    showIf:
      question: profile-q-4
      notEquals: 0
    choices:
      - Employee of an organization in Morocco (public or private, incl. nearshore)
      - Employee of a foreign organization (abroad, or remote from Morocco)
      - Freelancer / independent (incl. full-time bug bounty)
      - Founder or running my own company
      - Internship or apprenticeship (incl. PFE)
      - Student (school, university, 1337, OFPPT...)
      - Looking for work
      - Other
