title: Role & specialization
label: roles
position: 2
questions:
  - label: Which cybersecurity domain best describes your role, focus, or main interest?
    required: true
    multiple: false
    choices:
      - Offensive security / penetration testing
      - Red teaming
      - Security operations (SOC) / blue team
      - Incident response / DFIR
      - Application security (AppSec)
      - Cloud security
      - Governance, risk & compliance (GRC)
      - Malware analysis / reverse engineering
      - Security engineering / DevSecOps
      - Management / CISO
      - Still exploring / no specific area yet
      - Other

  - label: What is your seniority level?
    required: false
    showIf:
      question: profile-q-5
      in: [0, 1, 2, 3]
    choices:
      - Junior / entry-level (0-2 years)
      - Mid-level
      - Senior
      - Lead / Principal
      - Manager / CISO
