title: Role & specialization
label: roles
position: 2
questions:
  - label: "Which security domain best describes your current work? (no security work yet: the area you focus on)"
    required: true
    multiple: false
    choices:
      - Offensive security (pentest, red team, bug bounty)
      - Network, infrastructure & IT security (incl. sysadmins handling security)
      - Security operations (SOC) / blue team
      - Incident response / DFIR
      - Application security (AppSec)
      - Cloud security
      - Governance, risk & compliance (GRC)
      - Threat intelligence / malware analysis / reverse engineering
      - Security engineering / DevSecOps
      - Management / Head of security (CISO)
      - Still exploring / no specific area yet
      - Other
    optionShowIf:
      - options: [Management / Head of security (CISO)]
        showIf:
          all:
            - question: profile-q-5
              in: [3, 4, 5, 6, 7]
            - question: profile-q-6
              notEquals: 4
    softChecks:
      - options: [Still exploring / no specific area yet]
        when:
          question: profile-q-5
          in: [5, 6, 7]
        message: You have 7+ years in security but no specific area yet. Is that right?

  - label: What is your seniority level in your current security role?
    required: false
    showIf:
      all:
        - question: profile-q-6
          in: [0, 1]
        - question: profile-q-5
          notEquals: 0
    choices:
      - Junior / entry-level
      - Mid-level
      - Senior
      - Lead / Principal (no direct reports)
      - Manager (leads a team)
      - Head of security / CISO
    optionShowIf:
      - options: [Head of security / CISO]
        showIf:
          question: profile-q-5
          in: [3, 4, 5, 6, 7]
      - options: [Junior / entry-level, Mid-level]
        showIf:
          question: roles-q-0
          notEquals: 9
    softChecks:
      - options: [Junior / entry-level]
        when:
          question: profile-q-5
          in: [6, 7]
        message: Junior / entry-level with 11+ years in security. Is that right?

  - label: Do you take part in bug bounty or VDP programs (organizations invite you to test, e.g. HackerOne, YesWeHack, Bugcrowd)?
    required: true
    multiple: false
    choices:
      - Yes, regularly
      - Yes, now and then
      - Tried it, no longer active
      - Not yet, learning or planning to
      - "No"
